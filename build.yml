name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Genera la cartella android/ se non esiste nel repo
      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name gdpr_privacy_app --org it.privacyeraser .
          fi

      # Aggiunge <queries> per mailto/https (necessario su Android 11+)
      - name: Patch AndroidManifest
        run: python3 .github/workflows/patch_manifest.py

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
